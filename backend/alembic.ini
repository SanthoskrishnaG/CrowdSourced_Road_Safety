# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default line below lines up
# with the behavior of more traditional engines
# file_template = %%(rev)s_%%(slug)s

# sys.path path, separator is '%(path_separator)s', which defaults to ';' on Windows and ':' on Unix
prepend_sys_path = .

# timezone to use when rendering the date within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# timezone = UTC

# max length of characters to associate with 'slug' in the migration file name
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be imported that define custom types.
# custom_types = false

# logging configuration is handled via logging.config.fileConfig
# if you want to use dictConfig, define your dictConfig in env.py and remove the configuration below.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
